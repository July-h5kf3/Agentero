site_name: Motif 文档
site_description: Motif 本地优先 Agent 科研工作台文档
repo_url: https://github.com/poco-ai/motif
repo_name: poco-ai/motif
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  highlightjs: true

nav:
  - 首页: index.md
  - 前端:
      - 概览: frontend/index.md
      - UI 规范: frontend/ui.md
      - 组件约定: frontend/components.md
  - 后端:
      - 概览: backend/index.md
      - API 契约: backend/api.md
      - 数据模型: backend/data-model.md
      - 论文目录库: backend/catalog.md
      - 魔棒与 Translator: backend/identifier-lookup.md
      - 双链与图谱: backend/wikilinks.md
  - 测试:
      - 概览: test/index.md
  - 开发:
      - 概览: development/index.md
      - 产品需求: development/prd.md
      - 技术方案: development/technical-plan.md
      - PDF 划词提问: development/pdf-ask.md
      - 路线图: development/roadmap.md
      - TODO: development/todo.md
      - 产品假设: development/hypothesis.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - fenced_code
  - codehilite

plugins:
  - search

strict: true
