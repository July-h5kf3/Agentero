site_name: Agentero 文档
site_description: Agentero 本地优先 Agent 科研工作台文档
repo_url: https://github.com/poco-ai/agentero
repo_name: poco-ai/agentero
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  highlightjs: true

nav:
  - 首页: index.md
  - 用户指南:
      - 使用指南: usage/index.md
      - 安装与首次使用: usage/getting-started.md
      - 导入和管理论文: usage/import-papers.md
      - 阅读、标注与整理: usage/read-and-organize.md
      - 接入 Agent: usage/agents.md
      - 使用 Zotero Connector: usage/zotero.md
      - 打开远程 Vault: usage/remote-vault.md
  - 前端:
      - 概览: frontend/index.md
      - UI 规范: frontend/ui.md
      - 组件约定: frontend/components.md
  - 后端:
      - 概览: backend/index.md
      - API 契约: backend/api.md
      - 数据模型: backend/data-model.md
      - 论文目录库: backend/catalog.md
      - 魔棒与 Translator: backend/identifier-lookup.md
      - Paper 入库流水线: backend/paper-import-pipeline.md
      - Zotero Connector 兼容: backend/connector.md
      - 双链与图谱: backend/wikilinks.md
  - 测试:
      - 概览: test/index.md
  - 开发:
      - 概览: development/index.md
      - 产品需求: development/prd.md
      - 技术方案: development/technical-plan.md
      - CLI 设计: development/cli.md
      - PDF 划词提问: development/pdf-ask.md
      - 翻译服务: development/translate.md
      - 运行日志: development/logging.md
      - 远程 Vault（SSH/SFTP）: development/remote-vault.md
      - 路线图: development/roadmap.md
      - TODO: development/todo.md
      - GitHub Project: development/github-project.md
  - Bug 修复记录:
      - DeepSeek 正文落入 Thinking: bug_fix/deepseek-thinking-body.md
      - ACP 会话恢复 ID 错误: bug_fix/acp-session-resume-id.md
      - 输入法组字 Enter 误发送: bug_fix/ime-composition-enter-submit.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - fenced_code
  - codehilite

plugins:
  - search

strict: true
