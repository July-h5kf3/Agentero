name: Build installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build installers (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Agentero ${{ github.ref_name }}
          releaseBody: |
            Installers and CLI for Agentero ${{ github.ref_name }}.

            ## Desktop
            Platform installers from Tauri (see assets below).

            ## CLI (`agentero`)
            Headless Vault / Catalog machine interface (no BYOA).
            Download the matching `agentero-*-…` archive, extract, and put `agentero` on your `PATH`.

            ```bash
            agentero --version
            agentero vault which --json
            ```

            Source install (slow; pulls desktop Rust deps):
            ```bash
            cargo install --git https://github.com/${{ github.repository }} --tag ${{ github.ref_name }} --locked --package agentero-cli
            ```
          releaseDraft: true
          prerelease: false

      # --- Headless CLI: attach prebuilt bin to the same draft release ---
      - name: Build agentero CLI (release)
        run: cargo build -p agentero-cli --release

      - name: Package CLI artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          OUT_DIR="dist-cli"
          mkdir -p "$OUT_DIR"

          STAGE="agentero-${VERSION}-${HOST}"
          mkdir -p "$STAGE"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/release/agentero.exe" "$STAGE/agentero.exe"
            # Prefer PowerShell zip for portability on windows-latest
            powershell.exe -NoProfile -Command \
              "Compress-Archive -Path '${STAGE}/agentero.exe' -DestinationPath '${OUT_DIR}/${STAGE}.zip' -Force"
            echo "CLI_ASSET=${OUT_DIR}/${STAGE}.zip" >> "$GITHUB_ENV"
          else
            cp "target/release/agentero" "$STAGE/agentero"
            chmod +x "$STAGE/agentero"
            tar -C "$STAGE" -czf "${OUT_DIR}/${STAGE}.tar.gz" agentero
            echo "CLI_ASSET=${OUT_DIR}/${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi
          ls -la "$OUT_DIR"

      - name: Upload CLI to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ env.CLI_ASSET }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
