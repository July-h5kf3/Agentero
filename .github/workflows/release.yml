name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Shared draft so installers + CLI can upload in parallel without racing create.
  prepare:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Agentero ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Installers and CLI for Agentero ${{ github.ref_name }}.

            ## Desktop
            Platform installers from Tauri (see assets below).

            ## CLI (`agentero`)
            Headless Vault / Catalog machine interface (no BYOA).
            Download the matching `agentero-*-…` archive, extract, and put `agentero` on your `PATH`.

            ```bash
            agentero --version
            agentero vault which --json
            ```

            Source install (slow; pulls desktop Rust deps):
            ```bash
            cargo install --git https://github.com/${{ github.repository }} --tag ${{ github.ref_name }} --locked --package agentero-cli
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  installers:
    name: Installers (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, ubuntu-24.04-arm, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Agentero ${{ github.ref_name }}
          # Body is set by the prepare job; keep draft + same tag.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  cli:
    name: CLI (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, ubuntu-24.04-arm, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # agentero-cli path-depends agentero_lib (Tauri), so Linux still needs WebKit link libs.
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build agentero CLI (release)
        run: cargo build -p agentero-cli --release

      - name: Package CLI artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          OUT_DIR="dist-cli"
          mkdir -p "$OUT_DIR"

          STAGE="agentero-${VERSION}-${HOST}"
          mkdir -p "$STAGE"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/release/agentero.exe" "$STAGE/agentero.exe"
            powershell.exe -NoProfile -Command \
              "Compress-Archive -Path '${STAGE}/agentero.exe' -DestinationPath '${OUT_DIR}/${STAGE}.zip' -Force"
            echo "CLI_ASSET=${OUT_DIR}/${STAGE}.zip" >> "$GITHUB_ENV"
          else
            cp "target/release/agentero" "$STAGE/agentero"
            chmod +x "$STAGE/agentero"
            tar -C "$STAGE" -czf "${OUT_DIR}/${STAGE}.tar.gz" agentero
            echo "CLI_ASSET=${OUT_DIR}/${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi
          ls -la "$OUT_DIR"

      - name: Write SHA256 checksum
        shell: bash
        run: |
          cd dist-cli
          sha256sum "$(basename "$CLI_ASSET")" > "$(basename "$CLI_ASSET").sha256"

      - name: Upload CLI to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            ${{ env.CLI_ASSET }}
            dist-cli/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
