name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Prepare PDFium runtime
        shell: bash
        run: |
          # liteparse downloads PDFium during the build, but its runtime loader
          # still needs the shared-library directory in the test environment.
          cargo test -p agentero --lib --no-run
          PDFIUM_LIB_PATH="$(
            find "$HOME/Library/Caches/pdfium-rs" \
              -type f \
              -name 'libpdfium.dylib' \
              -print -quit 2>/dev/null
          )"
          if [[ -z "$PDFIUM_LIB_PATH" ]]; then
            echo "libpdfium.dylib was not found in the PDFium cache" >&2
            exit 1
          fi
          PDFIUM_LIB_PATH="$(dirname "$PDFIUM_LIB_PATH")"
          echo "PDFIUM_LIB_PATH=$PDFIUM_LIB_PATH" >> "$GITHUB_ENV"
      - run: cargo test --workspace
      - run: cargo build -p agentero-cli
