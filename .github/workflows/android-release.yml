name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Android signing configuration
        id: signing-config
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for VAR in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!VAR:-}" ]]; then
              missing+=("$VAR")
            fi
          done

          if ((${#missing[@]} > 0)); then
            echo "Android signing is not configured; missing: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "::error::Manual Android builds require all signing secrets"
              exit 1
            else
              echo "::warning::Skipping Android release build because signing secrets are not configured"
            fi
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        if: steps.signing-config.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        if: steps.signing-config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        if: steps.signing-config.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.signing-config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        if: steps.signing-config.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        if: steps.signing-config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install release keystore
        if: steps.signing-config.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          cat > src-tauri/gen/android/app/keystore.properties <<EOF
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          storeFile=${KEYSTORE_PATH}
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          EOF

      - name: Build signed APK
        if: steps.signing-config.outputs.ready == 'true'
        run: pnpm tauri android build --apk --target aarch64

      - name: Rename APK with version
        if: steps.signing-config.outputs.ready == 'true'
        id: apk
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          SRC="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          DEST="Agentero_${VERSION}_aarch64.apk"
          if [[ ! -f "$SRC" ]]; then
            echo "::error::APK not found at ${SRC}"
            exit 1
          fi
          mv "$SRC" "$DEST"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        if: steps.signing-config.outputs.ready == 'true' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ steps.apk.outputs.path }}

      - name: Upload APK artifact
        if: steps.signing-config.outputs.ready == 'true' && github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}
